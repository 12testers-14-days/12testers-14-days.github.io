<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>
  
  <!-- Clean Light Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="1000" cy="150" r="350" fill="#38bdf8" opacity="0.12" />
  <circle cx="200" cy="550" r="280" fill="#6366f1" opacity="0.08" />

  <g transform="translate(100, 95)">
    <!-- Brand Badge with Modern Squircle Logo -->
    <g transform="translate(0, 0)">
      <rect width="48" height="48" rx="12" fill="url(#accentGrad)" />
      <rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <path d="M16 13C16 11.8 17.4 11 18.4 11.7L32 20.2C33 20.8 33 22.2 32 22.8L18.4 31.3C17.4 32 16 31.2 16 30V13Z" fill="#ffffff" />
      <circle cx="34" cy="33" r="8" fill="#ffffff" />
      <circle cx="34" cy="33" r="6.5" fill="url(#badgeGrad)" />
      <path d="M31 33L33 35L37 30.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0f172a">12 Testers <tspan fill="url(#accentGrad)">For 14 Days</tspan></text>
      <text x="320" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">by AppConsoleLab</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#0f172a" letter-spacing="-1.5">
      12 Testers For 14 Days
    </text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Google Play Closed Testing Service
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#475569">
      Complete Google Play's 14-day closed testing rule with real Android users on physical smartphones.
    </text>
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#64748b">
      Active Daily Engagement &bull; Zero Bots &bull; 100% Money-Back Guarantee &bull; 24/7 WhatsApp Support
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 350)">
      <rect width="240" height="85" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="120" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">14 Days</text>
      <text x="120" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Continuous Active Opt-in</text>

      <rect x="270" width="240" height="85" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="390" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#10b981" text-anchor="middle">100% Real</text>
      <text x="390" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Physical Android Devices</text>

      <rect x="540" width="240" height="85" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="660" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#2563eb" text-anchor="middle">Production</text>
      <text x="660" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Access Approval Support</text>
    </g>
  </g>
</svg>